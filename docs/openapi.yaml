# Pinned to 3.1.0 for maximum compatibility with oapi-codegen and
# openapi-typescript, which may not have caught up to 3.2 yet (released
# 2025-09-19). Nothing in this document uses 3.2-exclusive features, so
# revisit bumping to 3.2 once tooling support has matured.
openapi: 3.1.0
info:
  title: BlockFactor API
  summary: Location intelligence and rental property scoring for Chicago, IL.
  description: >
    REST API for computing composite livability scores (0-100) for
    residential addresses in Chicago, based on transit access, commute
    duration, grocery access, third places, green space, noise, flood risk,
    solar exposure, and public safety. See docs/PRD.md for the full scoring
    formula and docs/ARCHITECTURE.md for the response-contract decisions
    this spec implements.
  version: 0.1.0

servers:
  - url: http://localhost:4001
    description: Local development (Phase 1). Production server entries are added in Phase 7.

tags:
  - name: Scoring
    description: Composite address scoring.
  - name: Geocoding
    description: Address-to-coordinate resolution.
  - name: Isochrones
    description: Walk/transit reach polygons.
  - name: Layers
    description: Static, city-wide spatial map layers (CTA rail, stations, bike routes, trail access, supermarkets).
  - name: Places
    description: Per-address nearby cafes, fitness venues, and supermarkets.
  - name: Health
    description: Service liveness.

paths:
  /api/v1/score:
    post:
      tags: [Scoring]
      operationId: scoreAddress
      summary: Compute a composite livability score for an address.
      description: >
        Accepts either a raw address or pre-resolved coordinates from a
        prior call to /api/v1/geocode, computes the composite BlockFactor
        score, and returns per-factor sub-scores plus benchmark commute
        pills. Exactly one of `address` or `origin` must be provided.
        Requests outside the City of Chicago boundary are rejected with
        422 OUT_OF_COVERAGE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
            examples:
              byAddress:
                summary: Score by raw address
                value:
                  address: "233 S Wacker Dr, Chicago, IL"
                  destination: "1 N State St, Chicago, IL"
      responses:
        "200":
          description: Composite score computed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/OutOfCoverage"

  /api/v1/geocode:
    get:
      tags: [Geocoding]
      operationId: geocodeAddress
      summary: Resolve a raw address to ranked coordinate candidates.
      description: >
        One-shot geocode used to disambiguate an address before scoring.
        No typeahead/autocomplete support in Phase 1, per the public
        Nominatim usage policy (docs/THIRD_PARTY_REQUIREMENTS.md).
      parameters:
        - name: q
          in: query
          required: true
          description: Raw address text to geocode.
          schema:
            type: string
      responses:
        "200":
          description: Ranked geocode candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/isochrones:
    get:
      tags: [Isochrones]
      operationId: getIsochrones
      summary: Get 15-minute walk and 30-minute transit reach polygons for a coordinate.
      description: >
        Served independently from /api/v1/score for faster first paint and
        separate caching (docs/ARCHITECTURE.md §13.1).
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Isochrone polygons as GeoJSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsochroneResponse"
        "422":
          $ref: "#/components/responses/OutOfCoverage"

  /api/v1/places:
    get:
      tags: [Places]
      operationId: getPlaces
      summary: Get nearby cafes, fitness venues, and supermarkets around a coordinate.
      description: >
        Per-address radius, not city-wide (docs/ARCHITECTURE.md Decision Log
        row 30) -- reuses S_third_place's existing Google Places grid-cache
        lookup for cafes/fitness, blended with a radius-scoped osm_pois
        supermarket query. Requests outside the City of Chicago boundary are
        rejected with 422 OUT_OF_COVERAGE to avoid spending Places API
        budget on out-of-coverage coordinates.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Nearby places as GeoJSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacesResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/OutOfCoverage"

  /api/v1/layers/cta-rail:
    get:
      tags: [Layers]
      operationId: getCtaRailLinesLayer
      summary: Get CTA 'L' rail track geometry as GeoJSON.
      description: >
        Bulk, city-wide layer — no request parameters. Backed by
        `cta_rail_lines` (docs/DATA_SOURCES.md "CTA 'L' Lines"), the only
        real per-line rail track geometry available; `cta_stops` has only
        station points, and `noise_sources`' CTA track geometry is
        line-agnostic.
      responses:
        "200":
          description: CTA rail line segments as a GeoJSON FeatureCollection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtaRailLinesResponse"

  /api/v1/layers/cta-stations:
    get:
      tags: [Layers]
      operationId: getCtaStationsLayer
      summary: Get CTA 'L' station locations as GeoJSON.
      description: Bulk, city-wide layer — no request parameters.
      responses:
        "200":
          description: CTA stations as a GeoJSON FeatureCollection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtaStationsResponse"

  /api/v1/layers/bike-routes:
    get:
      tags: [Layers]
      operationId: getBikeRoutesLayer
      summary: Get protected/buffered/painted bike infrastructure as GeoJSON.
      description: Bulk, city-wide layer — no request parameters.
      responses:
        "200":
          description: Bike route segments as a GeoJSON FeatureCollection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BikeRoutesResponse"

  /api/v1/layers/trail-access:
    get:
      tags: [Layers]
      operationId: getTrailAccessLayer
      summary: Get off-street trail (linear park) boundaries as GeoJSON.
      description: >
        Bulk, city-wide layer — no request parameters. Backed by
        `parks WHERE park_class = 'LINEAR PARK'` (e.g. the Lakefront Trail,
        The 606/Bloomingdale Trail) per the existing PRD §5.5 schema
        decision — not `bike_routes`, which has no trail category at all.
      responses:
        "200":
          description: Trail-access park boundaries as a GeoJSON FeatureCollection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrailAccessResponse"

  /api/v1/layers/supermarkets:
    get:
      tags: [Layers]
      operationId: getSupermarketsLayer
      summary: Get supermarket locations as GeoJSON.
      description: Bulk, city-wide layer — no request parameters.
      responses:
        "200":
          description: Supermarkets as a GeoJSON FeatureCollection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupermarketsResponse"

  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    Coordinates:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180

    UnitMetadata:
      type: object
      description: Optional unit-level metadata powering the solar exposure factor.
      properties:
        facing:
          type: string
          enum: [N, NE, E, SE, S, SW, W, NW]
        floor:
          type: integer
          minimum: 1
          default: 1
        exposure:
          type: string
          enum: [street, courtyard, alley]

    WeightOverrides:
      type: object
      description: >
        Optional per-factor weight overrides (0-100). Any omitted factor
        falls back to preset defaults; active weights are dynamically
        renormalized so they sum to 100%.
      properties:
        transit: { type: number, minimum: 0, maximum: 100 }
        commute: { type: number, minimum: 0, maximum: 100 }
        bike: { type: number, minimum: 0, maximum: 100 }
        grocery: { type: number, minimum: 0, maximum: 100 }
        thirdPlace: { type: number, minimum: 0, maximum: 100 }
        green: { type: number, minimum: 0, maximum: 100 }
        noise: { type: number, minimum: 0, maximum: 100 }
        safety: { type: number, minimum: 0, maximum: 100 }
        flood: { type: number, minimum: 0, maximum: 100 }
        solar: { type: number, minimum: 0, maximum: 100 }

    ScoreRequest:
      type: object
      description: >
        Exactly one of `address` or `origin` must be provided; the API
        returns 400 if neither or both are set. Deliberately not expressed
        as a `oneOf` in this schema — with `oapi-codegen`, `oneOf` produces
        a wrapper type requiring `AsX`/`FromX`/`MergeX` accessor methods
        rather than a flat struct, which is worse ergonomics than a plain
        optional-pointer field validated in the handler. Same rule applies
        to `destination` vs. `destinationCoordinates`; if omitted entirely,
        the commute factor is hidden and weights renormalize across the
        remaining 8 factors.
      properties:
        address:
          type: string
          description: Raw address to geocode before scoring. Mutually exclusive with `origin`.
        origin:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: Pre-resolved origin coordinates from a prior /api/v1/geocode call. Mutually exclusive with `address`.
        destination:
          type: string
          description: Optional workplace/destination address for the custom commute factor.
        destinationCoordinates:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: Pre-resolved destination coordinates. Mutually exclusive with `destination`.
        weights:
          $ref: "#/components/schemas/WeightOverrides"
        unit:
          $ref: "#/components/schemas/UnitMetadata"

    ContributingPoi:
      type: object
      required: [name, distanceMeters]
      properties:
        name:
          type: string
        distanceMeters:
          type: number

    FactorScore:
      type: object
      required: [degraded]
      properties:
        score:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Composite sub-score (0-100). Null when `degraded` is true.
        degraded:
          type: boolean
          description: >
            True when this factor timed out or lacked data; its weight was
            excluded from the composite score and the remaining weights
            renormalized.
        distanceMeters:
          type: [number, "null"]
          description: Straight-line distance in meters to the nearest contributing feature, when applicable.
        contributingPois:
          type: array
          items:
            $ref: "#/components/schemas/ContributingPoi"

    CommutePill:
      type: object
      description: Benchmark commute duration to one of Chicago's major economic hubs, always computed live.
      required: [destination, durationMinutes, transfers, summary]
      properties:
        destination:
          type: string
          enum: [loop, fulton_market, ohare, midway]
        durationMinutes:
          type: integer
        transfers:
          type: integer
        summary:
          type: string
          description: Human-readable itinerary summary, e.g. "Pink Line direct".

    ScoreResponse:
      type: object
      required: [compositeScore, factors, benchmarkCommutes]
      properties:
        compositeScore:
          type: number
          minimum: 0
          maximum: 100
        factors:
          type: object
          description: "`commute` is present only when a destination was supplied in the request."
          required:
            [
              transit,
              bike,
              grocery,
              thirdPlace,
              green,
              noise,
              safety,
              flood,
              solar,
            ]
          properties:
            transit: { $ref: "#/components/schemas/FactorScore" }
            commute: { $ref: "#/components/schemas/FactorScore" }
            bike: { $ref: "#/components/schemas/FactorScore" }
            grocery: { $ref: "#/components/schemas/FactorScore" }
            thirdPlace: { $ref: "#/components/schemas/FactorScore" }
            green: { $ref: "#/components/schemas/FactorScore" }
            noise: { $ref: "#/components/schemas/FactorScore" }
            safety: { $ref: "#/components/schemas/FactorScore" }
            flood: { $ref: "#/components/schemas/FactorScore" }
            solar: { $ref: "#/components/schemas/FactorScore" }
        benchmarkCommutes:
          type: array
          items:
            $ref: "#/components/schemas/CommutePill"

    GeocodeCandidate:
      type: object
      required: [formattedAddress, coordinates, rank]
      properties:
        formattedAddress:
          type: string
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        rank:
          type: integer
          description: 0-indexed rank; 0 is the top match.

    GeocodeResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/GeocodeCandidate"

    IsochroneFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        properties:
          type: object
          required: [mode, minutes]
          properties:
            mode:
              type: string
              enum: [walk, transit]
            minutes:
              type: integer
              enum: [15, 30]
        geometry:
          type: object
          description: GeoJSON Polygon or MultiPolygon geometry.
          required: [type, coordinates]
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon]
            coordinates:
              type: array
              description: >
                GeoJSON coordinate array. Left untyped because Polygon uses
                [][][2]float64 while MultiPolygon uses [][][][2]float64 —
                OpenAPI cannot express this union cleanly. Validated at the
                Go layer via GeoJSON parsing.
              items: {}

    IsochroneResponse:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/IsochroneFeature"

    CtaRailLineFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        properties:
          type: object
          required: [lines, express, grade]
          properties:
            lines:
              type: array
              items:
                type: string
              description: CTA line names sharing this track segment, e.g. ["Brown", "Purple"].
            express:
              type: boolean
              description: True if any line on this segment runs express service here.
            grade:
              type: string
              enum: [subway, elevated_or_at_grade]
        geometry:
          type: object
          description: GeoJSON MultiLineString geometry.
          required: [type, coordinates]
          properties:
            type:
              type: string
              const: MultiLineString
            coordinates:
              type: array
              items: {}

    CtaRailLinesResponse:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/CtaRailLineFeature"

    CtaStationFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        properties:
          type: object
          required: [name, lines, ada]
          properties:
            name:
              type: string
            lines:
              type: array
              items:
                type: string
            ada:
              type: boolean
        geometry:
          type: object
          description: GeoJSON Point geometry.
          required: [type, coordinates]
          properties:
            type:
              type: string
              const: Point
            coordinates:
              type: array
              items: {}

    CtaStationsResponse:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/CtaStationFeature"

    BikeRouteFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        properties:
          type: object
          required: [routeType]
          properties:
            routeType:
              type: string
              enum:
                - "Protected Bike Lane"
                - "Neighborhood Greenway"
                - "Buffered Bike Lane"
                - "Bike Lane"
                - "Marked Shared Lane"
            streetName:
              type: ["string", "null"]
        geometry:
          type: object
          description: GeoJSON MultiLineString geometry.
          required: [type, coordinates]
          properties:
            type:
              type: string
              const: MultiLineString
            coordinates:
              type: array
              items: {}

    BikeRoutesResponse:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/BikeRouteFeature"

    TrailAccessFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        properties:
          type: object
          required: [name]
          properties:
            name:
              type: string
        geometry:
          type: object
          description: GeoJSON MultiPolygon geometry.
          required: [type, coordinates]
          properties:
            type:
              type: string
              const: MultiPolygon
            coordinates:
              type: array
              items: {}

    TrailAccessResponse:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/TrailAccessFeature"

    SupermarketFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        properties:
          type: object
          properties:
            name:
              type: ["string", "null"]
              description: Null when OSM has no name tag for this store.
        geometry:
          type: object
          description: GeoJSON Point geometry.
          required: [type, coordinates]
          properties:
            type:
              type: string
              const: Point
            coordinates:
              type: array
              items: {}

    SupermarketsResponse:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/SupermarketFeature"

    PlaceFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        properties:
          type: object
          required: [name, category, distanceMeters]
          properties:
            name:
              type: string
            category:
              type: string
              enum: [cafe, fitness, supermarket]
            distanceMeters:
              type: number
        geometry:
          type: object
          description: GeoJSON Point geometry.
          required: [type, coordinates]
          properties:
            type:
              type: string
              const: Point
            coordinates:
              type: array
              items: {}

    PlacesResponse:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/PlaceFeature"

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. `OUT_OF_COVERAGE`.
        message:
          type: string

  responses:
    OutOfCoverage:
      description: The requested coordinates fall outside the City of Chicago boundary.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            outOfCoverage:
              value:
                code: OUT_OF_COVERAGE
                message: The provided address is outside the City of Chicago boundary.
    ValidationError:
      description: The request failed validation (e.g. missing required field, all weights zero).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
